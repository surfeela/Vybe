<style>
:root{--bg:#09090b;--surface:#141418;--surface2:#1d1d23;--line:#303039;--text:#fafafa;--muted:#a1a1aa;--accent:#9b7bff;--accent2:#d946ef;--good:#34d399;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:#050507;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{max-width:1380px;min-height:100dvh;margin:auto;background:var(--bg);display:grid;grid-template-columns:230px minmax(0,1fr) 300px;border-left:1px solid #202026;border-right:1px solid #202026}.sidebar{padding:26px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:22px}.logo{font-weight:950;font-size:28px;letter-spacing:2px;padding:2px 12px}.logo b{color:var(--accent)}.nav{display:flex;flex-direction:column;gap:7px}.nav button,.mobile-nav button{border:0;background:transparent;color:#b7b7c2;padding:13px 14px;text-align:left;border-radius:13px;display:flex;align-items:center;gap:13px;font-size:14px}.nav button.active,.nav button:hover{background:#26212f;color:#fff}.ico{font-size:20px;width:23px;text-align:center}.createbtn,.primary{border:0;background:linear-gradient(120deg,#8b5cf6,#b14ce2);color:white;font-weight:750;border-radius:12px;padding:12px 16px;box-shadow:0 7px 24px #8b5cf622}.sideprofile{margin-top:auto;border-top:1px solid var(--line);padding:18px 7px 0;display:flex;gap:10px;align-items:center}.avatar{width:39px;height:39px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#8b5cf6,#ec4899);color:white;font-weight:850;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted)}.tiny{font-size:11px}.center{min-width:0;border-right:1px solid var(--line)}.topbar{height:70px;padding:0 25px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;background:#09090bf2;backdrop-filter:blur(16px);z-index:4}.mobile-logo{display:none;font-weight:950;letter-spacing:2px}.search{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;max-width:450px;width:100%}.search input{border:0;outline:0;background:transparent;color:white;width:100%;font-size:13px}.iconbtn{width:39px;height:39px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:white;position:relative}.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent2);right:7px;top:7px}.page{padding:25px;max-width:820px;margin:auto}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}.eyebrow{color:var(--accent);text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:1.8px}.h1{font-size:27px;letter-spacing:-1px;font-weight:900;margin:5px 0}.sub{color:var(--muted);font-size:13px;line-height:1.6}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{padding:12px 3px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:13px}.tabs button.active{color:white;border-color:var(--accent);font-weight:800}.post{border:1px solid var(--line);background:var(--surface);border-radius:18px;margin-bottom:19px;overflow:hidden}.posthead{display:flex;align-items:center;gap:10px;padding:15px 16px}.grow{flex:1;min-width:0}.name{font-size:13px;font-weight:800}.handle{font-size:11px;color:var(--muted);margin-top:3px}.more{border:0;background:transparent;color:#b8b8c3;font-size:22px}.media{height:380px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 60% 35%,#a855f7 0%,transparent 26%),radial-gradient(ellipse at 25% 80%,#db2777 0%,transparent 35%),linear-gradient(145deg,#17172a,#3b1b54 45%,#0c0b15);display:grid;place-items:center}.media img,.media video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.arttext{font-size:clamp(35px,7vw,65px);font-weight:950;letter-spacing:-3px;text-shadow:0 5px 30px #0007;z-index:1;text-align:center;padding:20px}.artsub{position:absolute;bottom:26px;font-size:10px;letter-spacing:4px;z-index:1}.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:1px solid #ffffff55;border-radius:50%;width:55px;height:55px;background:#09090b66;color:white;font-size:23px;z-index:2;backdrop-filter:blur(7px)}.postbody{padding:14px 16px}.caption{font-size:13px;line-height:1.65;margin:0 0 9px}.tags{font-size:12px;color:#c4b5fd}.sound{font-size:11px;color:#b0b0bc;margin-top:12px}.actions{display:flex;align-items:center;gap:18px;padding:0 16px 15px}.action{display:flex;align-items:center;gap:6px;background:transparent;border:0;color:#d4d4dc;font-size:12px;padding:4px 0}.action .sym{font-size:20px}.action.on{color:#c4b5fd}.action.like.on{color:#fb7185}.action:last-child{margin-left:auto}.rightbar{padding:25px 18px;position:sticky;top:0;height:100dvh;overflow:auto}.widget{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:17px}.widgethead{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:850;margin-bottom:15px}.trend{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #28282f}.trend:last-child{border-bottom:0}.rank{font-size:12px;color:#71717a;font-weight:900}.trendname{font-size:12px;font-weight:800}.trendmeta{font-size:10px;color:var(--muted);margin-top:4px}.suggest{display:flex;align-items:center;gap:9px;padding:10px 0}.follow{border:1px solid #51436e;background:#29203b;color:#d8caff;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:750}.footer{font-size:10px;color:#71717a;line-height:1.9;padding:8px}.mobile-nav{display:none}.hidden{display:none!important}.gridvideos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.thumb{height:185px;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(140deg,#6d28d9,#18181b);color:white;text-align:left;padding:0}.thumb:nth-child(3n+2){background:linear-gradient(140deg,#ea580c,#431407)}.thumb:nth-child(3n){background:linear-gradient(140deg,#0891b2,#172554)}.thumb .thumbword{font-size:21px;font-weight:950;position:absolute;top:37%;left:8px;right:8px;text-align:center}.thumb .thumbmeta{position:absolute;bottom:0;left:0;right:0;padding:9px;background:linear-gradient(transparent,#000c);font-size:11px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.chip{border:1px solid var(--line);background:var(--surface2);color:#d4d4dc;padding:8px 13px;border-radius:999px;font-size:11px}.chip.active{background:#6d28d9;border-color:#8b5cf6;color:white}.field{display:block;width:100%;background:#101014;border:1px solid #3c3c47;border-radius:11px;padding:12px;color:white;font-size:13px;margin-top:7px}.label{font-size:12px;color:#d4d4dc;display:block;margin:16px 0 5px}.formrow{margin-bottom:13px}.secondary{background:#202027;color:white;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:12px}.notice{border:1px solid #413356;background:#1b1527;border-radius:12px;padding:13px;font-size:12px;color:#d9c9f9;line-height:1.6;margin:15px 0}.profilehero{background:radial-gradient(ellipse at 80% 0%,#8b5cf633,transparent 45%),var(--surface);border:1px solid var(--line);border-radius:18px;padding:23px;margin-bottom:18px}.stats{display:flex;gap:28px;margin:20px 0}.stats strong{display:block;font-size:19px}.stats span{font-size:11px;color:var(--muted)}.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.empty{text-align:center;padding:42px 20px;color:var(--muted);font-size:13px}.overlay{position:fixed;inset:0;z-index:20;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modal{background:#17171d;border:1px solid #393943;border-radius:20px;padding:20px;width:min(500px,100%);max-height:85dvh;overflow:auto;box-shadow:0 30px 100px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;font-weight:850}.close{border:0;background:#2a2a32;color:white;border-radius:9px;width:31px;height:31px}.comment{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.5}.comment b{margin-right:7px}.toast{position:fixed;z-index:50;bottom:24px;left:50%;transform:translateX(-50%);background:#26232f;border:1px solid #55446f;color:white;border-radius:999px;padding:12px 17px;font-size:12px;box-shadow:0 10px 40px #0009;max-width:90vw}.mobile-create{display:none}
@media(max-width:1050px){.app{grid-template-columns:205px minmax(0,1fr)}.rightbar{display:none}}
@media(max-width:680px){body{background:var(--bg)}.app{display:block;border:0;padding-bottom:70px}.sidebar{display:none}.center{border:0}.topbar{height:60px;padding:0 15px}.mobile-logo{display:block}.topbar .search{max-width:none}.topbar .search input{font-size:12px}.page{padding:18px 13px}.media{height:min(64vh,470px);min-height:310px}.post{border-radius:14px}.posthead{padding:12px}.postbody{padding:12px}.actions{padding:0 12px 13px;gap:14px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px max(9px,env(safe-area-inset-bottom));background:#111115f5;backdrop-filter:blur(18px);border-top:1px solid var(--line)}.mobile-nav button{padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;border-radius:8px;text-align:center}.mobile-nav button.active{color:#c4b5fd}.mobile-nav .ico{font-size:20px}.gridvideos{gap:6px}.thumb{height:145px}.h1{font-size:25px}.mobile-create{display:inline-block}.desktop-create{display:none}}
</style>
</head><body>
<div class="app">
<aside class="sidebar"><div class="logo">VY<b>B</b>E</div><nav class="nav" id="sidenav"><button data-page="home" class="active"><span class="ico">⌂</span>Home feed</button><button data-page="discover"><span class="ico">⌕</span>Discover</button><button data-page="create"><span class="ico">⊕</span>Create video</button><button data-page="inbox"><span class="ico">♧</span>Inbox <span id="unreadSide" class="muted tiny"></span></button><button data-page="profile"><span class="ico">◉</span>My profile</button><button data-page="saved"><span class="ico">▣</span>Saved videos</button></nav><button class="createbtn desktop-create" data-page="create">＋ &nbsp;Create a video</button><div class="sideprofile"><div class="avatar">Y</div><div class="grow"><div class="name" id="sideName">Your VYBE</div><div class="handle">@yourhandle</div></div><button class="more" data-page="profile">···</button></div></aside>
<main class="center"><header class="topbar"><div class="mobile-logo">VY<span style="color:var(--accent)">B</span>E</div><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search videos, creators, hashtags…" aria-label="Search videos and creators"><button id="searchGo" class="secondary" style="padding:6px 9px">Search</button></div><button class="iconbtn" data-page="inbox" aria-label="Inbox">♧<span id="unreadDot" class="dot"></span></button></header><div id="view"></div></main>
<aside class="rightbar"><section class="widget"><div class="widgethead">🔥 Trending now <span class="muted">•••</span></div><div id="trending"></div><button class="secondary" data-page="discover" style="width:100%;margin-top:8px">Explore trends →</button></section><section class="widget"><div class="widgethead">Creators to follow <span class="muted">↗</span></div><div id="suggestions"></div></section><div class="footer">About · Community guidelines · Privacy · Terms<br>© 2026 VYBE community prototype.<br>Demo app — no real cloud service connected.</div></aside>
</div>
<nav class="mobile-nav" id="mobileNav"><button class="active" data-page="home"><span class="ico">⌂</span>Home</button><button data-page="discover"><span class="ico">⌕</span>Discover</button><button data-page="create"><span class="ico">⊕</span>Create</button><button data-page="inbox"><span class="ico">♧</span>Inbox</button><button data-page="profile"><span class="ico">◉</span>Profile</button></nav>
<div id="overlay" class="overlay" role="dialog" aria-modal="true"><div id="modal" class="modal"></div></div><div id="toasts"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const key='vybe-prototype-v2';
const seed=[
{id:'v1',user:'luna.creates',name:'Luna Reyes',avatar:'L',caption:'A little reminder to make space for beautiful things. ✨',tags:'#aesthetic #dailyvibes',sound:'original sound · luna',likes:24800,comments:126,shares:82,word:'DREAM',sub:'MAKE IT HAPPEN',style:0,following:false,commentsList:[{user:'skylar',text:'needed this today 💜'},{user:'jayden',text:'the vibe is unreal'},{user:'nora',text:'more videos like this please'}]},
{id:'v2',user:'omar.visuals',name:'Omar Hassan',avatar:'O',caption:'Golden hour hits different. Who else loves this vibe?',tags:'#cinematic #goldenhour',sound:'Golden · ambient edit',likes:12600,comments:94,shares:43,word:'GOLDEN',sub:'CHASE THE LIGHT',style:1,following:false,commentsList:[{user:'ella',text:'that light!! 🔥'},{user:'liam',text:'cinematic perfection'}]},
{id:'v3',user:'mika.motion',name:'Mika Chen',avatar:'M',caption:'POV: your next chapter starts today. 🌊',tags:'#motivation #newchapter',sound:'Ocean eyes · instrumental',likes:38200,comments:312,shares:201,word:'BEGIN',sub:'YOUR NEXT CHAPTER',style:2,following:true,commentsList:[{user:'ava',text:'new chapter energy 🌊'},{user:'noah',text:'saving this reminder'}]},
{id:'v4',user:'zara.afterdark',name:'Zara',avatar:'Z',caption:'City lights, late nights, and a playlist on repeat.',tags:'#nightlife #cityvibes',sound:'midnight city · edit',likes:9800,comments:71,shares:36,word:'AFTER',sub:'DARK MODE ON',style:3,following:false,commentsList:[]},
{id:'v5',user:'thegoodframe',name:'Theo',avatar:'T',caption:'Tiny moments. Big memories. Keep the camera rolling.',tags:'#filmmaking #creative',sound:'soft focus · original',likes:17100,comments:143,shares:92,word:'CAPTURE',sub:'THE LITTLE THINGS',style:4,following:false,commentsList:[]},
{id:'v6',user:'nadiacooks',name:'Nadia',avatar:'N',caption:'A recipe does not need to be complicated to be good.',tags:'#foodtok #homecooking',sound:'Sunday kitchen',likes:22400,comments:208,shares:116,word:'SAVOUR',sub:'MADE WITH LOVE',style:5,following:false,commentsList:[]}
];
const styles=[['#a855f7','#db2777','#17172a','#3b1b54'],['#f97316','#fb923c','#301d25','#7c2d12'],['#22d3ee','#0891b2','#0c2834','#164e63'],['#ec4899','#8b5cf6','#25132e','#701a75'],['#34d399','#0f766e','#102b2b','#164e63'],['#fbbf24','#f97316','#33200e','#78350f']];
let state={page:'home',feed:'For You',current:0,search:'',videos:seed,liked:{},saved:{},followed:{'mika.motion':true},notifications:[{id:1,user:'mika.motion',text:'liked your video',time:'2m',read:false},{id:2,user:'luna.creates',text:'started following you',time:'18m',read:false},{id:3,user:'omar.visuals',text:'mentioned you in a comment',time:'1h',read:true}],profileTab:'Videos',user:{name:'Your VYBE',handle:'yourhandle',bio:'Creating my own little corner of the internet ✨'},muted:true};
try{let s=JSON.parse(localStorage.getItem(key)||'null');if(s&&s.videos&&Array.isArray(s.videos)){state={...state,...s};state.videos=state.videos.map(v=>({...v,commentsList:v.commentsList||[]}));}}catch(e){}
let toastTimer,activeCommentId=null;function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){toast('Storage is full. Large videos are not saved permanently.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':String(n)}function toast(s){$('#toasts').innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toasts').innerHTML='',2600)}function all(){return state.videos}function get(id){return all().find(v=>v.id===id)}function current(){let list=feedVideos();if(!list.length)return null;return list[Math.min(state.current,list.length-1)]}function feedVideos(){let list=all();if(state.feed==='Following')list=list.filter(v=>state.followed[v.user]||v.user==='yourhandle');if(state.search)list=list.filter(v=>(v.user+' '+v.name+' '+v.caption+' '+v.tags).toLowerCase().includes(state.search.toLowerCase()));return list}function initials(v){return `<div class="avatar">${esc(v.avatar||v.user?.[0]?.toUpperCase()||'V')}</div>`}function avatar(v){return v.avatarUrl?`<div class="avatar"><img src="${esc(v.avatarUrl)}" alt=""></div>`:initials(v)}function pageHead(k,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1 class="h1">${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}function buttonPage(p,label,cls='secondary'){return `<button class="${cls}" data-page="${p}">${label}</button>`}
function art(v,compact=false){let st=styles[v.style??0]||styles[0];return `<div class="media" style="background:radial-gradient(ellipse at 60% 32%,${st[0]} 0%,transparent 28%),radial-gradient(ellipse at 22% 78%,${st[1]} 0%,transparent 34%),linear-gradient(145deg,${st[2]},${st[3]} 52%,#0c0b15)">${v.mediaUrl?(v.mediaType==='video'?`<video src="${esc(v.mediaUrl)}" controls playsinline></video>`:`<img src="${esc(v.mediaUrl)}" alt="Post by ${esc(v.user)}">`):`<div class="arttext">${esc(v.word||'YOUR VYBE')}</div><div class="artsub">${esc(v.sub||'SHARE YOUR STORY')}</div>`}${!v.mediaUrl?'<button class="play" data-play="'+esc(v.id)+'" aria-label="Preview video">▷</button>':''}</div>`}
function post(v){let liked=!!state.liked[v.id],saved=!!state.saved[v.id],following=!!state.followed[v.user],isOwn=v.user==='yourhandle';return `<article class="post" data-post="${esc(v.id)}"><div class="posthead">${avatar(v)}<div class="grow"><div class="name">${esc(v.name||v.user)} ${isOwn?'<span class="muted tiny">· You</span>':''}</div><div class="handle">@${esc(v.user)} · ${esc(v.time||'Recently')}</div></div>${!isOwn?`<button class="follow" data-follow="${esc(v.user)}">${following?'Following':'+ Follow'}</button>`:''}<button class="more" data-more="${esc(v.id)}" aria-label="More post options">···</button></div>${art(v)}<div class="postbody"><p class="caption">${esc(v.caption)}</p><div class="tags">${esc(v.tags||'')}</div><div class="sound">♫ &nbsp;${esc(v.sound||'original sound')}</div></div><div class="actions"><button class="action like ${liked?'on':''}" data-like="${esc(v.id)}"><span class="sym">${liked?'♥':'♡'}</span>${fmt(v.likes+(liked?1:0))}</button><button class="action" data-comments="${esc(v.id)}"><span class="sym">▢</span>${(v.commentsList||[]).length+(v.comments||0)}</button><button class="action ${saved?'on':''}" data-save="${esc(v.id)}"><span class="sym">${saved?'▣':'♧'}</span>${saved?'Saved':'Save'}</button><button class="action" data-repost="${esc(v.id)}"><span class="sym">⟳</span>Repost</button><button class="action" data-share="${esc(v.id)}"><span class="sym">↗</span>Share</button></div></article>`}
function home(){let list=feedVideos();if(!list.length)return `<div class="page">${pageHead('YOUR FEED','Your feed is quiet','Follow creators or switch to For You for more videos.')}<div class="empty">No videos here yet.<br><br>${buttonPage('discover','Discover creators','primary')}</div></div>`;return `<div class="page">${pageHead('THE COMMUNITY','Your daily VYBE','Discover new creators and videos that match your mood.',`<button class="primary mobile-create" data-page="create">＋ Create</button>`)}<div class="tabs"><button data-feed="For You" class="${state.feed==='For You'?'active':''}">For You</button><button data-feed="Following" class="${state.feed==='Following'?'active':''}">Following</button></div>${list.map(post).join('')}<div class="empty">You're all caught up. ✨</div></div>`}
function thumb(v){let st=styles[v.style??0]||styles[0];return `<button class="thumb" data-openpost="${esc(v.id)}" style="background:radial-gradient(ellipse at 50% 35%,${st[0]},transparent 45%),linear-gradient(145deg,${st[2]},${st[3]})">${v.mediaUrl?`<img src="${esc(v.mediaUrl)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" alt="">`:''}<span class="thumbword">${esc(v.word||'VYBE')}</span><span class="thumbmeta">▶ ${fmt(v.likes+(state.liked[v.id]?1:0))} · ${esc(v.user)}</span></button>`}function videoGrid(list){return list.length?`<div class="gridvideos">${list.map(thumb).join('')}</div>`:'<div class="empty">Nothing here yet. Try another tab or create your first video.</div>'}
function discover(){let list=all().filter(v=>!state.search||(v.user+' '+v.name+' '+v.caption+' '+v.tags).toLowerCase().includes(state.search.toLowerCase()));return `<div class="page">${pageHead('EXPLORE','Discover','Find creators, ideas, and videos worth saving.') }<div class="search" style="max-width:none"><span>⌕</span><input id="discoverSearch" value="${esc(state.search)}" placeholder="Search creators, videos, hashtags…"><button class="secondary" id="clearSearch">Clear</button></div><div class="eyebrow">Popular hashtags</div><div class="chips">${['#aesthetic','#motivation','#cinematic','#dailyvibes','#foodtok','#creative','#nightlife'].map(t=>`<button class="chip ${state.search===t?'active':''}" data-tag="${t}">${t}</button>`).join('')}</div><div class="pagehead" style="margin-top:28px;margin-bottom:14px"><div><div class="h1" style="font-size:19px">${state.search?'Search results':'Popular videos'}</div><div class="sub">${list.length} videos and creators</div></div></div>${videoGrid(list)}<h3 style="font-size:15px;margin-top:28px">Creators you may like</h3>${all().filter(v=>v.user!=='yourhandle').slice(0,5).map(v=>`<div class="row">${avatar(v)}<div class="grow"><div class="name">${esc(v.name)}</div><div class="handle">@${esc(v.user)}</div></div><button class="follow" data-follow="${esc(v.user)}">${state.followed[v.user]?'Following':'Follow'}</button></div>`).join('')}</div>`}
function createPage(){return `<div class="page">${pageHead('MAKE SOMETHING','Create a video','Share a moment, a thought, or your next big idea.')}<form id="createForm"><div class="widget" style="margin:0"><div class="eyebrow">01 / Media</div><label class="label" for="mediaFile">Select a video or image</label><input id="mediaFile" class="field" type="file" accept="video/*,image/*"><div id="uploadPreview" class="notice">Choose a local file to preview it. This demo uses your browser and does not upload media to a server.</div><div class="eyebrow" style="margin-top:24px">02 / Story</div><label class="label" for="caption">Caption</label><textarea class="field" id="caption" maxlength="500" rows="4" required placeholder="Tell your community what this is about…"></textarea><div class="muted tiny" id="captionCount" style="text-align:right;margin-top:5px">0 / 500</div><label class="label" for="hashtags">Hashtags</label><input class="field" id="hashtags" placeholder="#dailyvibes #creative"><label class="label" for="sound">Sound title</label><input class="field" id="sound" placeholder="Original sound"><label class="label" for="visibility">Who can see this?</label><select class="field" id="visibility"><option>Everyone</option><option>Followers</option><option>Only me</option></select><label class="label"><input id="commentsAllowed" type="checkbox" checked> &nbsp; Allow comments</label><div class="notice">Prototype limitation: posting adds your item to this browser's local feed. Real cloud upload, transcoding, moderation, and public distribution need a backend.</div><button class="primary" style="width:100%;margin-top:12px" type="submit">Publish to VYBE ↗</button></div></form></div>`}
function inbox(){let unread=state.notifications.filter(n=>!n.read).length;return `<div class="page">${pageHead('YOUR COMMUNITY','Inbox','Activity from creators and people you follow.',`<button class="secondary" id="markAll">Mark all read</button>`)}<div class="tabs"><button class="active">Activity ${unread?`· ${unread} new`:''}</button><button data-page="discover">Find people</button></div>${state.notifications.length?state.notifications.map(n=>`<div class="row" data-notif="${n.id}" style="cursor:pointer">${initials({avatar:n.user[0].toUpperCase()})}<div class="grow"><div style="font-size:13px;line-height:1.6"><b>@${esc(n.user)}</b> ${esc(n.text)}</div><div class="handle">${esc(n.time)} ago</div></div>${n.read?'<span class="muted tiny">Read</span>':'<span style="height:8px;width:8px;border-radius:50%;background:var(--accent);flex-shrink:0"></span>'}</div>`).join(''):'<div class="empty">No notifications yet.</div>'}<div class="notice">Your inbox is part of this local prototype. Real-time notifications and private messaging need server-side services.</div></div>`}
function profile(){let own=all().filter(v=>v.user==='yourhandle');let list=state.profileTab==='Saved'?all().filter(v=>state.saved[v.id]):state.profileTab==='Liked'?all().filter(v=>state.liked[v.id]):own;return `<div class="page"><section class="profilehero"><div style="display:flex;gap:15px;align-items:center">${initials({avatar:'Y'})}<div class="grow"><div class="h1" style="font-size:22px;margin:0">${esc(state.user.name)}</div><div class="handle">@${esc(state.user.handle)}</div></div><button class="secondary" id="editProfile">Edit profile</button></div><p class="sub" style="margin-top:17px">${esc(state.user.bio)}</p><div class="stats"><div><strong>${own.length}</strong><span>Videos</span></div><div><strong>${Object.keys(state.followed).filter(k=>state.followed[k]).length+1204}</strong><span>Followers*</span></div><div><strong>318</strong><span>Following*</span></div></div><div class="muted tiny">*Sample counts for this prototype.</div></section><div class="tabs"><button data-profiletab="Videos" class="${state.profileTab==='Videos'?'active':''}">▦ Videos</button><button data-profiletab="Saved" class="${state.profileTab==='Saved'?'active':''}">♧ Saved</button><button data-profiletab="Liked" class="${state.profileTab==='Liked'?'active':''}">♥ Liked</button></div>${videoGrid(list)}<div class="notice">Your likes, saved posts, and demo profile are stored locally in this browser. They are not synced to other devices.</div></div>`}
function savedPage(){let list=all().filter(v=>state.saved[v.id]);return `<div class="page">${pageHead('YOUR COLLECTION','Saved videos','Keep the videos you want to revisit.')} ${videoGrid(list)}</div>`}
function render(){let v=$('#view');if(state.page==='home')v.innerHTML=home();else if(state.page==='discover')v.innerHTML=discover();else if(state.page==='create')v.innerHTML=createPage();else if(state.page==='inbox')v.innerHTML=inbox();else if(state.page==='profile')v.innerHTML=profile();else v.innerHTML=savedPage();$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('#globalSearch').value=state.search;let unread=state.notifications.some(n=>!n.read);$('#unreadDot').classList.toggle('hidden',!unread);$('#unreadSide').textContent=unread?'• New':'';$('#trending').innerHTML=['#aesthetic','#motivation','#cinematic','#dailyvibes'].map((t,i)=>`<div class="trend"><span class="rank">0${i+1}</span><div><div class="trendname">${t}</div><div class="trendmeta">${['24.8K','18.2K','12.4K','9.7K'][i]} posts this week</div></div></div>`).join('');$('#suggestions').innerHTML=all().filter(v=>v.user!=='yourhandle').slice(0,3).map(v=>`<div class="suggest">${avatar(v)}<div class="grow"><div class="name">${esc(v.name)}</div><div class="handle">@${esc(v.user)}</div></div><button class="follow" data-follow="${esc(v.user)}">${state.followed[v.user]?'✓':'+'}</button></div>`).join('');persist()}
function modal(html){$('#modal').innerHTML=html;$('#overlay').style.display='flex'}function closeModal(){$('#overlay').style.display='none'}function commentModal(id){let v=get(id);if(!v)return;activeCommentId=id;modal(`<div class="modalhead"><span>Comments · ${(v.commentsList||[]).length+(v.comments||0)}</span><button class="close" data-close>×</button></div><div>${(v.commentsList||[]).map(c=>`<div class="comment"><b>@${esc(c.user)}</b>${esc(c.text)}</div>`).join('')||'<div class="empty">Be the first to comment.</div>'}</div><form id="commentForm" style="display:flex;gap:8px;margin-top:15px"><input class="field" id="commentText" maxlength="300" required placeholder="Add a thoughtful comment…" style="margin:0"><button class="primary">Post</button></form>`)}function shareModal(id){modal(`<div class="modalhead"><span>Share this VYBE</span><button class="close" data-close>×</button></div><p class="sub">Share the vibe with someone who would love it.</p><div class="chips"><button class="chip" data-shareto="Message">✉ Message</button><button class="chip" data-shareto="Friends">◉ Friends</button><button class="chip" data-shareto="Copy link">↗ Copy demo link</button></div><div class="notice">This is a prototype share sheet. It does not send real messages or publish external links.</div>`)}
function openPost(id){state.page='home';state.search='';state.feed='For You';state.current=Math.max(0,feedVideos().findIndex(v=>v.id===id));render();setTimeout(()=>{let el=$(`[data-post="${CSS.escape(id)}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},40)}
let previewUrl=null;document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;
if(b.dataset.page){state.page=b.dataset.page;render();return}if(b.dataset.feed){state.feed=b.dataset.feed;state.current=0;render();return}if(b.dataset.tag){state.search=b.dataset.tag;state.page='discover';render();return}if(b.dataset.like){let id=b.dataset.like;state.liked[id]=!state.liked[id];render();return}if(b.dataset.save){let id=b.dataset.save;state.saved[id]=!state.saved[id];render();toast(state.saved[id]?'Saved to your collection':'Removed from saved');return}if(b.dataset.comments){commentModal(b.dataset.comments);return}if(b.dataset.share){shareModal(b.dataset.share);return}if(b.dataset.repost){let v=get(b.dataset.repost);if(v){let clone={...v,id:'repost-'+Date.now(),user:state.user.handle,name:state.user.name,caption:'Reposted: '+v.caption,time:'Just now',commentsList:[]};state.videos.unshift(clone);state.page='home';render();toast('Reposted to your profile in this demo')}return}if(b.dataset.follow){let u=b.dataset.follow;state.followed[u]=!state.followed[u];render();toast((state.followed[u]?'Following @':'Unfollowed @')+u);return}if(b.dataset.more){let id=b.dataset.more;modal(`<div class="modalhead">Post options<button class="close" data-close>×</button></div><div class="row"><button class="secondary" style="width:100%" data-save="${esc(id)}">Save / unsave video</button></div><div class="row"><button class="secondary" style="width:100%" data-report="${esc(id)}">⚑ Report this video</button></div><div class="row"><button class="secondary" style="width:100%" data-share="${esc(id)}">Share video</button></div><p class="muted tiny">Reporting is a local demo action and does not notify a moderation team.</p>`);return}if(b.dataset.report){let v=get(b.dataset.report);closeModal();toast('Demo report recorded for '+(v?'@'+v.user:'this post'));return}if(b.dataset.openpost){openPost(b.dataset.openpost);return}if(b.dataset.profiletab){state.profileTab=b.dataset.profiletab;render();return}if(b.dataset.notif){let n=state.notifications.find(n=>String(n.id)===b.dataset.notif);if(n)n.read=true;render();toast('Notification marked as read');return}if(b.id==='markAll'){state.notifications.forEach(n=>n.read=true);render();toast('All notifications marked as read');return}if(b.dataset.close!==undefined){closeModal();return}if(b.dataset.shareto){toast(b.dataset.shareto==='Copy link'?'Demo link copied (no real URL generated)':b.dataset.shareto+' share preview');closeModal();return}if(b.id==='searchGo'){state.search=$('#globalSearch').value.trim();state.page='discover';render();return}if(b.id==='clearSearch'){state.search='';render();return}if(b.id==='editProfile'){modal(`<div class="modalhead">Edit your profile<button class="close" data-close>×</button></div><form id="profileForm"><label class="label">Display name</label><input class="field" id="editName" maxlength="60" required value="${esc(state.user.name)}"><label class="label">Username</label><input class="field" id="editHandle" maxlength="25" pattern="[A-Za-z0-9_.]+" required value="${esc(state.user.handle)}"><label class="label">Bio</label><textarea class="field" id="editBio" maxlength="160" rows="3">${esc(state.user.bio)}</textarea><button class="primary" style="width:100%;margin-top:16px">Save profile</button></form>`);return}if(b.dataset.play){toast('Video playback requires a real video file');return}
});$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){state.search=e.target.value.trim();state.page='discover';render()}});$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='discoverSearch'){let p=e.target.selectionStart;state.search=e.target.value;let scroll=$('#view').scrollTop;$('#view').innerHTML=discover();$('#view').scrollTop=scroll;let n=$('#discoverSearch');n.focus();n.setSelectionRange(p,p)}if(e.target.id==='caption')$('#captionCount').textContent=e.target.value.length+' / 500'});
document.addEventListener('submit',e=>{if(e.target.id==='commentForm'){e.preventDefault();let v=get(activeCommentId);if(v){v.commentsList=v.commentsList||[];v.commentsList.push({user:state.user.handle,text:$('#commentText').value.trim()});persist();commentModal(v.id);toast('Comment added in this browser')}return}if(e.target.id==='profileForm'){e.preventDefault();state.user.name=$('#editName').value.trim();state.user.handle=$('#editHandle').value.trim().replace(/^@/,'');state.user.bio=$('#editBio').value.trim();closeModal();render();toast('Profile saved locally');return}if(e.target.id==='createForm'){e.preventDefault();let cap=$('#caption').value.trim();if(!cap){toast('Add a caption first');return}let file=$('#mediaFile').files[0],url=file?URL.createObjectURL(file):null;let v={id:'u'+Date.now(),user:state.user.handle,name:state.user.name,avatar:'Y',caption:cap,tags:$('#hashtags').value.trim()||'#myvybe',sound:$('#sound').value.trim()||'original sound',likes:0,comments:0,shares:0,commentsList:[],word:'YOUR VYBE',sub:'JUST PUBLISHED',style:Math.floor(Math.random()*styles.length),mediaUrl:url,mediaType:file?(file.type.startsWith('video/')?'video':'image'):null,time:'Just now',visibility:$('#visibility').value,commentsAllowed:$('#commentsAllowed').checked};state.videos.unshift(v);state.page='profile';state.profileTab='Videos';render();toast('Published to your local prototype');return}});
$('#view').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.openpost){openPost(b.dataset.openpost)}});
$('#view').addEventListener('change',e=>{if(e.target.id==='mediaFile'){let file=e.target.files[0];if(!file)return;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);let el=$('#uploadPreview');el.innerHTML=file.type.startsWith('video/')?`<video src="${previewUrl}" controls playsinline style="width:100%;max-height:250px;border-radius:10px;margin-top:7px"></video><div class="tiny muted">${esc(file.name)} · ${(file.size/1024/1024).toFixed(1)} MB · Local preview only</div>`:`<img src="${previewUrl}" alt="Selected preview" style="width:100%;max-height:250px;object-fit:contain;border-radius:10px;margin-top:7px"><div class="tiny muted">${esc(file.name)} · Local preview only</div>`}});
render();
})();
</script></body></html>
